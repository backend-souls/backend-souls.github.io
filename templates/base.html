<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="{{ get_url(path=config.extra.favicon | default(value='favicon.svg')) }}" />
    <link rel="stylesheet" href="{{ get_url(path='main.css', cachebust=true) }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500;600&display=swap" />
    <!-- Site accent override: theme default is red; we use blue. Must come after
         main.css so the cascade picks these values (same :root / [data-theme]
         specificity, later wins). See templates/base.html in the plan notes for
         why this isn't done in Sass (site-level sass/ partials aren't visible to
         the theme's own @import chain — Zola compiles theme and site sass as two
         separate passes). -->
    <style>
      :root {
        --color-accent-red: #2563eb;
        --font-body: 'Source Code Pro', 'Work Sans', sans-serif;
        --font-heading-primary: 'Font Awesome 6 Free', 'Oswald', sans-serif;
        --font-heading-secondary: 'Font Awesome 6 Free', 'Roboto Condensed', sans-serif;
      }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.25rem; }
      .title-text { font-size: 1.5rem; }
      @media (max-width: 768px) {
        .title-text { font-size: 1.15rem; }
      }
      .nav-link { font-size: 0.875rem; }
      .mobile-nav-link { font-size: 1.125rem; }
      .hero-title { font-size: 3.5rem; }
      @media (max-width: 768px) {
        .hero-title { font-size: 2.5rem; }
      }
      [data-theme="dark"] { --color-accent: #3b82f6; }
      .site-footer { padding: calc(var(--grid-unit) * 2) 0; }
      .social-link { width: 32px; height: 32px; }
      .social-link .social-icon { width: 16px; height: 16px; }
    </style>
    <link rel="alternate" type="application/rss+xml" title="{{ config.title }}" href="{{ get_url(path='blog/rss.xml', lang=lang) }}" />
    <script src="{{ get_url(path='theme-init.js', cachebust=true) }}"></script>
    {% block seo %}{{< seo title={config.title} description={config.description} /> }}{% endblock %}
  </head>
  <body>
    <div class="site-wrapper">
      {% include "partials/header.html" %}
      <main class="main-content {% block sidebar_class %}with-sidebar sidebar-{{ config.extra.sidebar_position | default(value="left") }}{% endblock %}">
        {% block sidebar %}<aside class="sidebar">{% include "partials/sidebar.html" %}</aside>{% endblock %}
        <div class="content">
          {% block content %}{% endblock %}
        </div>
      </main>
      {% include "partials/footer.html" %}
    </div>
    <script>window.VOLKS_SEARCH_URL = "{{ get_url(path='search/', trailing_slash=true, lang=lang) }}";</script>
    <script src="{{ get_url(path='search.js', cachebust=true) }}"></script>
  </body>
</html>
