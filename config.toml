# The URL the site will be built for
base_url = "https://blog.backendsouls.com"

title = "Backend Souls"
description = "Notes on backend engineering, systems design, and the craft of building software."

default_language = "en"

theme = "volks-typo"

compile_sass = true
minify_html = true

# Theme search uses static/search.js against search_json.html, not Zola's own index.
build_search_index = false

generate_feeds = true
feed_filenames = ["rss.xml"]

taxonomies = [
    { name = "categories", feed = true, paginate_by = 10 },
    { name = "tags", feed = true, paginate_by = 10 },
]

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[markdown.highlighting]
theme = "gruvbox-dark-medium"

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[link_checker]
internal_level = "warn"

