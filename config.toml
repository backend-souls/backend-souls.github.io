[extra]
# Nav labels come from [translations] via trans(key=item.key, lang=lang) since
# [languages.<code>.extra] is not a field Zola supports.
main_menu = [
    { key = "nav_home", url = "/" },
    { key = "nav_blog", url = "/blog" },
    { key = "nav_journal", url = "/journal" },
    { key = "nav_categories", url = "/categories" },
    { key = "nav_about", url = "/about" },
]

# Drives the header language switcher: on an `en` page, shows the `pt-br`
# entry's flag (linking to the Portuguese version) and vice versa.
languages_menu = [
    { code = "en", name = "English", flag = "🇬🇧" },
    { code = "pt-br", name = "Português", flag = "🇧🇷" },
]

# No custom favicon yet — falls back to the theme's bundled favicon.svg.
author_name = "Emanuel D R Sena"
